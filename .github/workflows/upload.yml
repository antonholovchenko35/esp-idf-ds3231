name: Upload component

on:
  push:
    tags:
      - "v*"

jobs:
  upload_components:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: espressif/upload-components-ci-action@v2
        with:
          components: "ds3231: ."
          namespace: "antonholovchenko35"
          version: ${{ github.ref_name }}
